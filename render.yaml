services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false

      - key: SHORT_URL_BASE
        sync: false

      - key: CACHE_TTL_SECONDS
        value: "3600"

      - key: MAX_SHORTEN_ATTEMPTS
        value: "5"