services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: url-shortener-redis
          type: keyvalue
          property: connectionString

      - key: SHORT_URL_BASE
        sync: false

      - key: CACHE_TTL_SECONDS
        value: "3600"

      - key: MAX_SHORTEN_ATTEMPTS
        value: "5"

  - type: keyvalue
    name: url-shortener-redis
    plan: free
    ipAllowList: []

databases:
  - name: url-shortener-db
    plan: free
    databaseName: urlshortener
    user: urlshortener